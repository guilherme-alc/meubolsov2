services:
  postgres:
    container_name: saldoa-postgres
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: saldoa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: