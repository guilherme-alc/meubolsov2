services:
  postgres:
    container_name: saldoa-postgres
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: saldoa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    container_name: saldoa-mailpit
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025" 

volumes:
  postgres_data: